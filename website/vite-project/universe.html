<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Coco-K">
    <title data-i18n="title.universe"></title>
</head>

<body>
    <header>
        <section class="logo-container">
            <image src="./logo64.jpg" alt="Logo"></image>
            <h1 data-i18n="site.name"></h1>
        </section>
        <div class="language-selector">
            <button class="language-button" type="button">
                Lang
                <span>⌄</span>
            </button>

            <div class="language-options">
                <button type="button" data-lang="en">en</button>
                <button type="button" data-lang="ja">jp</button>
            </div>
        </div>
        <button class="navigation-button hamburger" type="button">
            <span></span>
        </button>
    </header>
    <nav>
        <ul>
            <li><a href="./index.html" data-i18n="page.home"></a></li>
            <li><a href="#" data-i18n="page.universe"></a></li>
        </ul>
    </nav>
    <main>
        <div id="history-table-container">
            <table>
                <thead>
                    <tr>
                        <th data-i18n="weekday.sunday"></th>
                        <th data-i18n="weekday.monday"></th>
                        <th data-i18n="weekday.tuesday"></th>
                        <th data-i18n="weekday.wednesday"></th>
                        <th data-i18n="weekday.thursday"></th>
                        <th data-i18n="weekday.friday"></th>
                        <th data-i18n="weekday.saturday"></th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                </tbody>
            </table>
        </div>
    </main>
    <footer>
        <section class="logo-container">
            <image src="./logo64.jpg" alt="Logo"></image>
            <h1 data-i18n="site.name"></h1>
        </section>
        <p data-i18n="copyright"></p>
        <ul>
            <li><a href="./index.html" data-i18n="page.home"></a></li>
            <li><a href="#" data-i18n="page.universe"></a></li>
        </ul>
    </footer>

    <script type="module" src="./src/scripts/pages/universe.ts"></script>
</body>
</html>
